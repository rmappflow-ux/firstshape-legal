<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>First Shape — Legal</title>
<meta name="description" content="First Shape Privacy Policy and Terms of Use.">
<meta name="robots" content="index,follow">
<style>
:root{--bg:#f7f8f6;--surface:#fff;--fg:#1c2420;--muted:#5c6a63;--line:#dfe5e1;--accent:#0e8f81}
@media (prefers-color-scheme:dark){:root{--bg:#121715;--surface:#1a211e;--fg:#e7ece9;--muted:#9daaa3;--line:#2b3531;--accent:#3cc2b1}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:32px 20px 64px}
header{margin-bottom:24px}
.brand{font-weight:700;letter-spacing:.02em;color:var(--accent);font-size:14px;text-transform:uppercase}
h1{font-size:28px;line-height:1.25;margin:6px 0 0}
nav.langs{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 8px}
nav.langs a{border:1px solid var(--line);background:var(--surface);color:var(--fg);text-decoration:none;border-radius:999px;padding:6px 14px;font-size:14px}
nav.langs a:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
section.lang{border-top:1px solid var(--line);padding-top:24px;margin-top:32px}
h2{font-size:22px;margin:0 0 4px}
.updated{color:var(--muted);font-size:14px;margin:0 0 16px}
h3{font-size:17px;margin:24px 0 6px}
p{margin:0 0 12px}
a{color:var(--accent)}
.meta{margin-top:24px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;font-size:14px;color:var(--muted)}
.meta strong{color:var(--fg);font-weight:600}
footer{margin-top:40px;font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
<header><div class="brand">First Shape</div><h1>Legal</h1></header>
<p><a href="privacy/">Privacy Policy · Política de Privacidade · Política de Privacidad</a></p>
<p><a href="terms/">Terms of Use · Termos de Uso · Términos de Uso</a></p>
<footer>Rafael Melo de Farias · <a href="mailto:rmappflow@gmail.com">rmappflow@gmail.com</a></footer>
</div>
</body>
</html>
